services:
  migrate:
    build:
      context: .
    image: studio-clock:local
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-clock}
      DB_USER: ${DB_USER:-clock}
      DB_PASSWORD: ${DB_PASSWORD:-clock}
    command: ["uv", "run", "--no-sync", "python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  studio-clock:
    build:
      context: .
    image: studio-clock:local
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-clock}
      DB_USER: ${DB_USER:-clock}
      DB_PASSWORD: ${DB_PASSWORD:-clock}
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - staticfiles:/app/staticfiles

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-clock}
      POSTGRES_USER: ${DB_USER:-clock}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-clock}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  staticfiles: