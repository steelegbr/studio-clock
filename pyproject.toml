[project]
name = "studio-clock"
version = "0.1.0"
description = "A studio clock for broadcast radio."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "django-environ>=0.14.0",
    "django-unfold>=0.108.0",
    "psycopg2-binary>=2.9.13",
]

[dependency-groups]
dev = [
    "djlint>=1.46.4",
    "ruff>=0.16.10",
]

[tool.ruff.lint.per-file-ignores]
"**/forms/*.py" = ["RUF012"]
"**/migrations/*.py" = ["RUF012"]
"**/models/*.py" = ["RUF012"]