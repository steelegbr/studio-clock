{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lower Third - {{ object.name }}</title>
        {% if object.font %}
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family={{ object.font.font.family|urlencode }}:wght@{{ object.font.weight }}&display=swap"
                  rel="stylesheet">
        {% endif %}
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
              rel="stylesheet"
              integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
              crossorigin="anonymous">
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="{% static 'studioclock/lowerthird.css' %}">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
                crossorigin="anonymous"></script>
        <script src="{% static 'studioclock/lowerthird.js' %}" defer></script>
    </head>
    <body>
        <main id="lower-third"
              class="lower-third lower-third--off"
              data-api-url="{% url 'clock_api:station-now-playing' name=object.station.name %}"
              data-font-family="{{ object.font.font.family }}"
              data-font-weight="{{ object.font.weight }}"
              style="--lower-third-foreground: {{ object.foreground_colour }};
                     --lower-third-background: {{ object.background_colour }}">
            <p class="lower-third__title" data-song-title></p>
            <p class="lower-third__artist" data-song-artist></p>
        </main>
    </body>
</html>
