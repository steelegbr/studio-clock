{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Studio Clock - {{ object.name }}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
              rel="stylesheet"
              integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
              crossorigin="anonymous">
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="{% static 'studioclock/clock.css' %}">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
                crossorigin="anonymous"></script>
    </head>
    <body>
        {{ clock_json|json_script:"clock-settings" }}
        <div class="studio-clock"
             style="background-color: {{ object.background_colour }};
                    color: {{ object.foreground_colour }}">
            <main class="clock-main">
                <section class="clock-primary">
                    <div class="clock-canvas">
                        <canvas id="clock-canvas"></canvas>
                    </div>
                    <div class="clock-time">
                        <div id="time-display">Something minutes to seven</div>
                    </div>
                </section>
                <aside class="clock-secondary">
                    <div class="clock-branding">
                        {% if object.logo %}
                            <img class="clock-branding-logo"
                                 src="{{ object.logo.url }}"
                                 alt="{{ object.name }}">
                        {% else %}
                            <span class="clock-branding-name">{{ object.name }}</span>
                        {% endif %}
                    </div>
                    <div class="clock-weather">Weather</div>
                    <div class="clock-now-playing">Now Playing</div>
                </aside>
            </main>
            <footer class="clock-status">
                <div class="status-lamps">Optional Status Lamps</div>
            </footer>
        </div>
        <script src="{% static 'studioclock/clock.js' %}"></script>
    </body>
</html>
