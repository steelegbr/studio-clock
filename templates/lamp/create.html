{% extends "base.html" %}
{% block title %}Create New Lamp{% endblock %}
{% block page_title %}Create New Lamp{% endblock %}
{% block content %}
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% for field in form %}
            {% include "includes/form_field.html" with field=field %}
        {% endfor %}
        <button type="submit" class="btn btn-primary w-100">Create Lamp</button>
        <a href="{% url 'lamp:list' %}" class="btn btn-secondary w-100 mt-2">Cancel</a>
    </form>
{% endblock %}
